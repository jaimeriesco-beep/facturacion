{% load static %}{% with motivo=d.motivo_no_eliminable %}<form method="post" action="{% url 'documento_eliminar' d.pk %}" class="form-icono"{% if not motivo %} data-nombre="{{ d }}" data-aviso="{{ d.aviso_papelera }}" onsubmit="return confirm('¿Mover «' + this.dataset.nombre + '» a la papelera?\n\nPodrás restaurarlo durante {{ dias_papelera|default:30 }} días; después se elimina definitivamente.' + (this.dataset.aviso ? '\n\n' + this.dataset.aviso : ''))"{% endif %}>{% csrf_token %}{% if volver %}<input type="hidden" name="volver" value="{{ volver }}">{% endif %}{% if texto %}<button type="submit" class="boton-papelera{% if motivo %} bloqueado{% endif %}" title="{% if motivo %}No se puede eliminar: {{ motivo }}{% else %}Mover a la papelera{% endif %}"><svg class="icono" aria-hidden="true"><use href="{% static 'core/iconos.svg' %}#eliminar"/></svg>Eliminar</button>{% else %}<button type="submit" class="icono-accion basurero{% if motivo %} bloqueado{% endif %}" title="{% if motivo %}No se puede eliminar: {{ motivo }}{% else %}Mover a la papelera{% endif %}" aria-label="{% if motivo %}No se puede eliminar {{ d }}{% else %}Eliminar {{ d }}{% endif %}"><svg class="icono" aria-hidden="true"><use href="{% static 'core/iconos.svg' %}#eliminar"/></svg></button>{% endif %}</form>{% endwith %}
